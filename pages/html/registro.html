<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Cuenta - Agroanima Colombia</title>

    <link rel="stylesheet" href="../css/registro.css">
</head>

<body>

    <main class="contenedor">
        <section class="registro">
            <div class="logo">
                <div class="icono-logo">
                    <img src="../../img/logohorizontalletrasazules.png" alt="Agroanima Colombia">
                    <span></span>
                </div>
                <div class="nombre-logo">
                    <h2>AGROANIMA COLOMBIA</h2>                                                      <!-- Título principal-->
                </div>
            </div>
            <h1>Crear tu Cuenta</h1>                                                                 <!-- Título -->
            <p class="subtitulo">
                Únete a la plataforma líder en tecnología agropecuaria
            </p>
            <form>                                                                                <!-- comienzo formulario -->
                <div class="campo">                                                               <!-- Nombre -->
                    <label for="nombre">Nombre Completo</label>
                    <input 
                        type="text" 
                        id="nombre"
                        placeholder="Nombre"
                    >
                </div>
                <div class="campo">                                                               <!-- Correo -->
                    <label for="correo">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="correo"
                        placeholder="dfg56@agro.com"
                    >
                </div>
                <div class="campo">                                                                 <!-- Teléfono -->
                    <label for="telefono">Teléfono de Contacto</label>
                    <input 
                        type="tel" 
                        id="telefono"
                        placeholder="+57 312 456 xxxx"
                    >
                </div>
                <div class="campo">                                                                  <!-- Contraseña -->
                    <label for="password">Contraseña</label>
                    <div class="password-box">
                        <input 
                            type="password"
                            id="password"
                            placeholder="contraseña"
                        >
                        <button 
                            type="button"
                            class="ver-password"
                            onclick="mostrarPassword('password', this)"
                        >
                            ◉
                        </button>
                    </div>
                </div>
                <div class="campo">                                                                <!-- Confirme contraseña -->
                    <label for="confirmar">Confirmar Contraseña</label>
                    <div class="password-box">
                        <input 
                            type="password"
                            id="confirmar"
                            placeholder="confirme su contraseña"
                        >
                        <button 
                            type="button"
                            class="ver-password"
                            onclick="mostrarPassword('confirmar', this)"
                        >
                            ◉                                                                        <!-- ojito dde visibilidad de contraseña-->
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-crear">                                            <!-- Boton crear cuenta -->
                    Crear Cuenta
                </button>
            </form>
            <p class="login">                                                                        <!-- Login -->
                ¿Ya tienes cuenta?
                <a href="../html/login.html">Inicia Sesión</a>
            </p>
        </section>
    </main>
    <script src="../js/registro.js"></script>
</body>

</html>
