<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agroanima Colombia - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">                            <!-- Logo -->
                <img src=" " alt="Agroanima Colombia">.     <!-- se me olvido como subir la imagen Logo -->
            </div>

            <h1>¡Bienvenido de<br>nuevo!</h1>                <!-- Título -->

            <p class="subtitle">
                Ingresa a tu cuenta para gestionar tus insumos
            </p>

            
            <form>                        <!-- Formulario -->
                
                <div class="form-group">                  <!-- Correo -->

                    <label for="email">
                        Correo Electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="ejemplo@agro.com"
                        required
                    >
                </div>
                <div class="form-group password-group">            <!-- Contraseña -->
                    <label for="password">
                        Contraseña
                    </label>
                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            placeholder="••••••••••••"
                            required
                        >
                        <button
                            type="button"
                            class="toggle-password"
                            onclick="mostrarPassword()"
                        >
                            
                        </button>
                    </div>
                </div>
                <div class="forgot-container">                      <!-- Recuperar contraseña -->
                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
                                        <!-- Botón -->
                <button
                    type="submit"
                    class="login-button"
                >
                    Iniciar Sesión
                </button>

            </form>

            <!-- Registro -->
            <p class="register">
                ¿No tienes cuenta?
                <a href="#">
                    Regístrate aquí
                </a>
            </p>

        </section>

    </main>

    <script>


    </script>

</body>

</html>
