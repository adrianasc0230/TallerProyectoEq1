<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agroanima Colombia - Login</title>

    <link rel="stylesheet" href="../css/login.css">

    <script src="../../components/header/HeaderAgro.js" defer></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> 
    <script src="../../components/footer/FooterAgro.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="../../index.css" />
</head>

<body>
    <header-agro></header-agro>

    <main class="login-container">

        <section class="login-card">

            <div class="logito">                            <!-- Logo -->
                <img src="../../img/logohorizontalletrasblancas.png" alt="Agroanima Colombia">     
            </div>

            <h1>¡Bienvenido de<br>nuevo!</h1>                <!-- Título -->

            <p class="subtitle">
                Ingresa a tu cuenta para gestionar tus insumos
            </p>

            
            <form>                        <!-- Formulario -->
                
                <div class="form">                  <!-- Correo -->

                    <label for="email">
                        Correo Electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="ejemplo@agro.com"
                        required
                    >
                </div>
                <div class="form-group password-group">            <!-- Contraseña -->
                    <label for="password">
                        Contraseña
                    </label>
                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            placeholder="••••••••••••"
                            required
                        >
                        <button
                            type="button"
                            class="toggle-password"
                            onclick="mostrarPassword()"
                        >
                            
                        </button>
                    </div>
                </div>
                <div class="olvidaste-container" id="olvidar">                      <!-- Recuperar contraseña -->
                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
                                        <!-- Botón -->
                <button
                    type="submit"
                    class="login-button" 
                    id="button"
                >
                <a href="../../index.html">Iniciar Sesión</a>    
                </button>

            </form>

            <!-- Registro -->
            <p class="registro">
                ¿No tienes cuenta?
                <a href="../html/registro.html">
                    Regístrate aquí
                </a>
            </p>

        </section>

    </main>
    <footer-agro id="footer-contacto"></footer-agro>

    <script src ="../js/login.js"></script>

</body>

</html>
