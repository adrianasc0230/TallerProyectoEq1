<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documentcatalogo</title>
    <link rel="stylesheet" href="/index.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="/components/footer/FooterAgro.js" defer></script>
    <link rel="stylesheet" href="/components/footer/footer-agro.css" />
    <link rel="stylesheet" href="../css/catalogo.css" />

    <script src="/components/header/HeaderAgro.js" defer></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
  </head>
  <body>

    <header-agro pagina="catalogo"></header-agro>

    <main>
      <div class="sub-header">
        <nav class="breadcrumb">
          <a href="../../index.html">Inicio</a>
          <span>&gt;</span>
          <span class="breadcrumb-actual">Catálogo de Productos</span>
        </nav>
        <h1>Catálogo de Productos</h1>
      </div>
      <div class="contenedor-catalogo">
        <aside class="filtros">
          <div class="buscador">
            <span class="fas fa-magnifying-glass"></span>
            <input
              type="text"
              id="inputBuscar"
              placeholder="Buscar productos..."
            />
          </div>

          <div class="filtro-grupo">
            <h3>Categorías</h3>
            <ul class="filtro-lista" id="filtroCategorias"></ul>
          </div>

          <div class="filtro-grupo">
            <h3>Rango de Precio</h3>
            <ul class="filtro-lista">
              <li>
                <label>
                  <input type="radio" name="precio" value="0-50000" />
                  Menos de $50.000 COP
                </label>
              </li>
              <li>
                <label>
                  <input type="radio" name="precio" value="50000-150000" />
                  $50.000 - $150.000 COP
                </label>
              </li>
              <li>
                <label>
                  <input type="radio" name="precio" value="150000-999999999" />
                  Más de $150.000 COP
                </label>
              </li>
              <li>
                <label>
                  <input type="radio" name="precio" value="" checked />
                  Todos
                </label>
              </li>
            </ul>
          </div>

          
        </aside>

        <section class="productos">
          <div class="grid-productos" id="gridProductos">
            
          </div>

          <nav
            class="paginacion"
            id="paginacion"
            aria-label="Paginación de productos"
          ></nav>
        </section>
      </div>
    </main>

    <footer-agro id="footer-contacto"></footer-agro>
    
    <script src="../js/catalogo.js"></script>
  </body>
</html>
