<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>AgroAnima</title>
</head>
<body>

<header class="techo-del-rancho">

  
  <div class="cinta-cazadora">
    <div class="contenedor-tinto">

      
      <form class="buscador-avispado" action="/buscar" method="GET">
        <i class="icono-lupa-firme"></i>
        <input type="text" name="q" placeholder="Buscar productos..." aria-label="Buscar productos">
      </form>

     
      <div class="opciones-de-una">
        <a href="/perfil" class="perfil-parcero" aria-label="Perfil de usuario">
          <i class="icono-compita"></i>
        </a>
        <span class="plata-lucas">COP</span>
      </div>

    </div>
  </div>

  
  <nav class="brujula-principal">
    <div class="contenedor-fino">

      <div class="sello-grafico">
        <a href="/">
          <img src="./img/logohorizontalletrasazules.png" alt="Logo de AgroAnima Colombia">
        </a>
      </div>

      <ul class="rutas-del-parche">
        <li><a href="/" class="la-propia">Inicio</a></li>
        <li><a href="/catalogo">Catálogo</a></li>
        <li><a href="/nutricion">Nutrición</a></li>
        <li><a href="/salud">Salud</a></li>
        <li><a href="/equipos">Equipos</a></li>
        <li><a href="/contacto">Contacto</a></li>
      </ul>

     
      <div class="movidas-rapidas">
        <a href="/login" class="enlace-pilo" aria-label="Iniciar sesión">
          <i class="icono-entrar"></i>
        </a>
        <a href="/carrito" class="el-canasto" aria-label="Ver carrito">
          <i class="icono-mercado"></i>
          <span class="notificacion-campanazo">3</span>
        </a>
      </div>

    </div>
  </nav>

</header>
  


<section class="el-potrero-principal">
   
  <div class="sombra-bacana">
     
    <div class="cuadre-del-texto">
  
      <span class="chapa-de-orgullo">LÍDERES EN COLOMBIA</span>
  
      <h1 class="el-grito-fuerte">
        SOLUCIONES INTEGRALES PARA EL AGRO COLOMBIANO
      </h1>
  
      <p class="la-carreta-buena">
        Liderando la innovación en nutrición, salud y tecnología animal y agrícola. Calidad respaldada por expertos.
      </p>
 
      <div class="los-botones-bravos">
        <a href="/catalogo" class="boton-pa-lante">EXPLORAR PRODUCTOS</a>
        <a href="/contacto" class="boton-suave">SOLICITAR COTIZACIÓN</a>
      </div>

    </div>
 
    <div class="las-pepas-guia" aria-label="Controles del carrusel de imágenes">
      <button class="flecha-pa-tras" aria-label="Ver imagen anterior"></button>
      <span class="pepa-activa" aria-current="true"></span>
      <span class="pepa-dormida"></span>
      <button class="flecha-pa-lante" aria-label="Ver siguiente imagen"></button>
    </div>

  </div>

</section>

    <script src="index.js"></script>
</body>
</html>
